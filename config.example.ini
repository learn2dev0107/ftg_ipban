# Copy to ~/.config/fwban/config.ini (or point FWBAN_CONFIG at it).
# Works like a kubeconfig: one [context] per FortiGate (or FortiGate + VDOM).
#
#   host        IP or hostname (required)
#   port        HTTPS admin port (default 443)
#   vdoms       VDOM(s) to act on, comma separated, or "all" (optional; default =
#               the API admin's default VDOM). "vdom = X" also works.
#   token_env   name of the environment variable holding the REST API token (recommended)
#   token       the token itself (only if you accept it sitting in this file; chmod 600)
#   verify_ssl  true/false (default false)
#   timeout     seconds (default 15)
#   proxy       http://host:port, socks5h://host:port, or empty for direct

[fwban]
current-context = lab

[context lab]
host = 10.0.0.1
port = 443
vdom = root
token_env = FGT_LAB_TOKEN

[context prod-inbound]
host = 10.0.10.1
port = 8443
vdom = Inbound
token_env = FGT01_TOKEN
proxy = socks5h://127.0.0.1:1080
